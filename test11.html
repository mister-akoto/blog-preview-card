<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body></body>
  <script>
    let allowancePerWeek = Number(
      prompt("How much allowance do you get per week? ")
    );

    function calculateAllowance(allowance) {
      let savingDuration = Number(
        prompt("How many weeks do you want to save? ")
      );
      let totalSavings = savingDuration * allowance;
      console.log("You will save $" + totalSavings);
    }

    calculateAllowance(allowancePerWeek);
  </script>
</html>
