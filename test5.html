  <body></body>
  <script>

    let totalPages = Number(prompt("How many pages does the book have? "));
    let pagesPerDay = Number(prompt("How many pages do you read each day? "));


    let daysToReadBook = Math.ceil(totalPages / pagesPerDay);
    
    console.log("It will take you " +daysToReadBook + " days to read the book.");
    
  </script>
