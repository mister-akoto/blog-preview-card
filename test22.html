<!DOCTYPE html>
<html lang="en">

    <title>Test 22</title>

  <body></body>
  <script>
    let heightFeet = Number(prompt("Height(Feet)"));
    let heightInch = Number(prompt("Height (inches): "));

    let heightInCentimeters = (heightFeet * 12 + heightInch) * 2.54;
    
    console.log("Your height in centimeters is: " + heightInCentimeters + "cm");
  </script>
