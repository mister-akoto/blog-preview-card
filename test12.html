  <body></body>
  <script>
    let speedLimit = Number(prompt("What is the speed limit?"));
    let actualSpeed = Number(prompt("What is your actual speed?"));

    
    if (actualSpeed > speedLimit) {
      fine = 5 * actualSpeed;
      console.log("Your fine is $" + fine);
    } else {
      console.log("No fine");
    }
  </script>
