<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test 2</title>
  </head>
  <body></body>
  <script>
    let birthYear = prompt("What year were you born? ");

    let futureYear = prompt("What year do you want to check? ");

    function calculateAge(birthyear, futureyear) {
      let age = futureyear - birthyear;
      return age;
    }

    console.log(
      "You'll be " +
        calculateAge(birthYear, futureYear) +
        " years in " +
        futureYear
    );
  </script>
</html>
